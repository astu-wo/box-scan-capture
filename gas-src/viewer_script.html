<script>
  const state = {
    password: null,
    currentPage: 1,
    totalPages: 1,
    currentRecord: null,
  };

  const $ = (id) => document.getElementById(id);

  function renderIcons() {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  }

  function showLoading(message) {
    $('loading-message').textContent = message;
    $('loading-overlay').hidden = false;
  }

  function hideLoading() {
    $('loading-overlay').hidden = true;
  }

  window.addEventListener('load', () => {
    renderIcons();
    $('btn-login').addEventListener('click', login);
    $('password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
    $('btn-prev').addEventListener('click', () => loadPage(state.currentPage - 1));
    $('btn-next').addEventListener('click', () => loadPage(state.currentPage + 1));
    $('btn-list-retry').addEventListener('click', () => loadPage(state.currentPage));
    $('btn-back').addEventListener('click', showList);
    $('btn-lightbox-close').addEventListener('click', closeLightbox);

    // モーダル背景タップで閉じる
    $('lightbox').addEventListener('click', (e) => {
      if (e.target === $('lightbox')) {
        closeLightbox();
      }
    });
  });

  function login() {
    const pw = $('password-input').value;
    if (!pw) return;
    $('btn-login').disabled = true;
    $('auth-error').hidden = true;
    showLoading('ログインしています…');

    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        $('btn-login').disabled = false;
        if (res && res.ok) {
          state.password = pw;
          $('auth-section').hidden = true;
          $('list-section').hidden = false;
          renderIcons();
          loadPage(1);
        } else {
          $('auth-error').textContent = (res && res.error) || '認証に失敗しました';
          $('auth-error').hidden = false;
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        $('btn-login').disabled = false;
        $('auth-error').textContent = '通信エラー: ' + err.message;
        $('auth-error').hidden = false;
      })
      .verifyPassword(pw);
  }

  function loadPage(page) {
    if (page < 1) return;
    $('btn-prev').disabled = true;
    $('btn-next').disabled = true;
    renderListSkeleton();

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.ok) {
          showListError();
          updatePaginationButtons();
          showToast(res.error || '取得に失敗しました', 'error');
          return;
        }
        renderList(res);
      })
      .withFailureHandler((err) => {
        showListError();
        updatePaginationButtons();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .listRecords(state.password, page);
  }

  function renderListSkeleton() {
    const list = $('record-list');
    list.hidden = false;
    $('empty-message').hidden = true;
    list.innerHTML = Array.from({ length: 5 }, () => `
      <div class="record-skeleton" aria-hidden="true">
        <span class="record-skeleton-bar barcode"></span>
        <span class="record-skeleton-bar timestamp"></span>
      </div>
    `).join('');
  }

  function showListError() {
    $('record-list').hidden = true;
    $('empty-message').querySelector('p').textContent = '履歴を読み込めませんでした';
    $('empty-message').hidden = false;
    $('btn-list-retry').hidden = false;
  }

  function updatePaginationButtons() {
    $('btn-prev').disabled = state.currentPage <= 1;
    $('btn-next').disabled = state.currentPage >= state.totalPages;
  }

  function renderList(res) {
    state.currentPage = res.page;
    state.totalPages = res.totalPages;

    const listEl = $('record-list');
    listEl.innerHTML = '';
    $('empty-message').querySelector('p').textContent = '登録データがありません';
    $('btn-list-retry').hidden = true;

    if (!res.results || res.results.length === 0) {
      listEl.hidden = true;
      $('empty-message').hidden = false;
    } else {
      listEl.hidden = false;
      $('empty-message').hidden = true;

      res.results.forEach((r) => {
        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `
          <div class="record-card-main">
            <div class="record-card-header">
              <span class="record-barcode-badge">
                <i data-lucide="barcode"></i>
                <span>${escapeHtml(r.barcode)}</span>
              </span>
            </div>
            <div class="record-meta">
              <i data-lucide="clock"></i>
              <span>${escapeHtml(r.timestamp)}</span>
            </div>
            ${r.note ? `
              <div class="record-note">
                <i data-lucide="message-square"></i>
                <span>${escapeHtml(r.note)}</span>
              </div>
            ` : ''}
          </div>
          <div class="record-arrow">
            <i data-lucide="chevron-right"></i>
          </div>
        `;
        card.addEventListener('click', () => showDetail(r.row));
        listEl.appendChild(card);
      });
    }

    $('page-info').textContent = `${res.page} / ${res.totalPages}（全${res.totalCount}件）`;
    $('btn-prev').disabled = res.page <= 1;
    $('btn-next').disabled = res.page >= res.totalPages;
    renderIcons();
  }

  function showList() {
    $('detail-section').hidden = true;
    $('list-section').hidden = false;
    state.currentRecord = null;
    renderIcons();
  }

  function showDetail(rowNumber) {
    showLoading('登録データを読み込んでいます…');
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.ok) {
          hideLoading();
          showToast(res.error || '取得に失敗しました', 'error');
          return;
        }
        renderDetail(res.record);
        $('list-section').hidden = true;
        $('detail-section').hidden = false;
        renderIcons();
        hideLoading();
      })
      .withFailureHandler((err) => {
        hideLoading();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .getRecordByRow(state.password, rowNumber);
  }

  function renderDetail(record) {
    state.currentRecord = record;
    $('detail-timestamp').textContent = record.timestamp;
    $('detail-barcode').textContent = record.barcode;

    const noteRow = $('detail-note-row');
    if (record.note) {
      $('detail-note').textContent = record.note;
      noteRow.hidden = false;
    } else {
      $('detail-note').textContent = '(なし)';
      noteRow.hidden = false;
    }

    const grid = $('detail-images');
    grid.innerHTML = '';

    record.images.forEach((img) => {
      const fig = document.createElement('figure');
      fig.innerHTML = `
        <div class="img-container">
          <div class="img-skeleton">
            <i data-lucide="image"></i>
          </div>
          <img alt="${escapeHtml(img.label)}" loading="lazy">
        </div>
        <figcaption>
          <span class="face-name">${escapeHtml(img.label)}</span>
          <a href="#" class="btn-mini-save" download="${escapeHtml(record.barcode)}_${escapeHtml(img.label)}.webp">
            <i data-lucide="download"></i>
            <span>保存</span>
          </a>
        </figcaption>
      `;

      const imgEl = fig.querySelector('img');
      const skeletonEl = fig.querySelector('.img-skeleton');
      const dlLink = fig.querySelector('.btn-mini-save');

      grid.appendChild(fig);

      loadImage(img.fileId, (dataUrl) => {
        if (!dataUrl) {
          skeletonEl.classList.add('failed');
          skeletonEl.textContent = '画像を読み込めません';
          return;
        }
        imgEl.src = dataUrl;
        imgEl.addEventListener('load', () => {
          imgEl.classList.add('loaded');
          skeletonEl.classList.add('hidden');
        });
        imgEl.addEventListener('click', () => openLightbox(dataUrl, img.label));
        dlLink.href = dataUrl;
        renderIcons();
      });
    });

    renderIcons();
  }

  function loadImage(fileId, cb) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res.ok) {
          cb(`data:${res.mimeType};base64,${res.base64}`);
        } else {
          cb(null);
        }
      })
      .withFailureHandler((err) => {
        cb(null);
        showToast('画像取得失敗: ' + err.message, 'error');
      })
      .getImage(state.password, fileId);
  }

  function openLightbox(dataUrl, label) {
    $('lightbox-img').src = dataUrl;
    $('lightbox-label').textContent = label ? `${(state.currentRecord && state.currentRecord.barcode) || ''} - ${label}` : '撮影画像';
    const dlBtn = $('lightbox-download-link');
    dlBtn.href = dataUrl;
    dlBtn.download = `${(state.currentRecord && state.currentRecord.barcode) || 'scan'}_${label || 'image'}.webp`;

    $('lightbox').hidden = false;
    renderIcons();
  }

  function closeLightbox() {
    $('lightbox').hidden = true;
    $('lightbox-img').src = '';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let toastTimer = null;
  function showToast(msg, type) {
    const el = $('toast');
    let iconName = 'info';
    if (type === 'error') iconName = 'alert-circle';
    if (type === 'success') iconName = 'check-circle-2';

    el.innerHTML = `<i data-lucide="${iconName}"></i><span>${escapeHtml(msg)}</span>`;
    el.className = type || '';
    el.hidden = false;
    renderIcons();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2500);
  }
</script>
