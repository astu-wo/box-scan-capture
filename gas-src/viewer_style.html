<!-- File: viewer_style.html -->
<style>
  :root {
    color-scheme: light;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --border-focus: #10b981;
    --primary: #059669;
    --primary-hover: #047857;
    --primary-light: #ecfdf5;
    --secondary: #ffffff;
    --secondary-text: #334155;
    --secondary-border: #cbd5e1;
    --secondary-hover: #f1f5f9;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --danger-hover: #dc2626;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ヘッダー (スマホ撮影画面と完全一致) */
  header {
    padding: 14px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-main);
  }

  .header-icon {
    color: var(--primary);
    width: 22px;
    height: 22px;
  }

  /* メインレイアウト */
  main {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  section {
    margin-bottom: 20px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--text-main);
  }

  .section-title h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .section-title svg {
    color: var(--primary);
    width: 20px;
    height: 20px;
  }

  /* 情報カード（Info / Notice）: 左アクセントバーと淡色背景 */
  .info {
    background: var(--primary-light);
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid #a7f3d0;
    border-left: 5px solid var(--primary);
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(5, 150, 105, 0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: #065f46;
  }

  .info-row-icon {
    width: 18px;
    height: 18px;
    color: var(--primary);
    flex-shrink: 0;
  }

  .info strong {
    color: #065f46;
    font-size: 16px;
    font-weight: 700;
  }

  .barcode-highlight {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 18px !important;
    font-weight: 800 !important;
    letter-spacing: 0.5px;
    color: var(--primary-hover) !important;
  }

  /* フォームフィールド & ラベル */
  .form-field {
    margin-top: 14px;
  }

  #auth-section .form-field {
    margin-top: 0;
  }

  .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary-text);
    margin-bottom: 6px;
  }

  .field-label .label-icon {
    width: 15px;
    height: 15px;
    color: var(--text-muted);
  }

  /* 入力フィールド（Input Group） */
  .input-group {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    width: 18px;
    height: 18px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.15s ease;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px 14px 12px 38px;
    font-size: 15px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--secondary-border);
    background: #ffffff;
    color: var(--text-main);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }

  input[type="password"]:hover {
    border-color: #94a3b8;
  }

  input[type="password"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04), 0 0 0 3px rgba(5, 150, 105, 0.2);
  }

  input[type="password"]:focus + .input-icon,
  .input-group:focus-within .input-icon {
    color: var(--primary);
  }

  .error-text {
    color: var(--danger);
    background: var(--danger-light);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #fecaca;
  }

  /* アクション・ボタン */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .back-action {
    margin-top: 0;
    margin-bottom: 14px;
  }

  button, .btn-download {
    flex: 1;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
    font-family: inherit;
    border: 1px solid transparent;
    text-decoration: none;
  }

  button svg, .btn-download svg {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
  }

  button.primary {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 1px 2px rgba(5, 150, 105, 0.25);
  }

  button.primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  button.secondary, .btn-download.secondary {
    background: var(--secondary);
    color: var(--secondary-text);
    border-color: var(--secondary-border);
    box-shadow: var(--shadow-sm);
  }

  button.secondary:hover:not(:disabled), .btn-download.secondary:hover {
    background: var(--secondary-hover);
    border-color: #94a3b8;
  }

  button:active:not(:disabled) {
    transform: scale(0.985);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  /* ==============================================================
     スキャン履歴一覧（スマホ最適化カードリスト）
     ============================================================== */
  .record-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .record-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .record-card:hover {
    border-color: #a7f3d0;
    background-color: #f0fdf4;
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .record-card:active {
    transform: scale(0.99);
  }

  .record-card-main {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }

  .record-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .record-barcode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-hover);
    background: var(--primary-light);
    border: 1px solid #a7f3d0;
    border-radius: var(--radius-sm);
    padding: 3px 8px;
  }

  .record-barcode-badge svg {
    width: 16px;
    height: 16px;
    color: var(--primary);
  }

  .record-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .record-meta svg {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .record-note {
    font-size: 13px;
    color: var(--secondary-text);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .record-note svg {
    width: 14px;
    height: 14px;
    color: #94a3b8;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .record-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    transition: transform 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }

  .record-card:hover .record-arrow {
    color: var(--primary);
    transform: translateX(2px);
  }

  .record-arrow svg {
    width: 20px;
    height: 20px;
  }

  /* データなし */
  #empty-message {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-muted);
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border-color);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .empty-icon {
    width: 36px;
    height: 36px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  #empty-message p {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
  }

  /* ページネーション */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
  }

  .pagination button {
    flex: none;
    padding: 10px 16px;
    font-size: 14px;
  }

  .page-badge {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 9999px;
    padding: 6px 14px;
    box-shadow: var(--shadow-sm);
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary-text);
  }

  /* ==============================================================
     撮影画像グリッド
     ============================================================== */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 14px;
  }

  .image-grid figure {
    margin: 0;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
  }

  .image-grid figure:hover {
    box-shadow: var(--shadow-md);
    border-color: #a7f3d0;
  }

  .img-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #f1f5f9;
    overflow: hidden;
  }

  .image-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: zoom-in;
    display: block;
    transition: transform 0.2s ease, opacity 0.2s ease;
    opacity: 0;
  }

  .image-grid img.loaded {
    opacity: 1;
  }

  .image-grid img:hover {
    transform: scale(1.03);
  }

  /* 画像スケルトンローダー */
  .img-skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: skeleton-pulse 1.5s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .img-skeleton.hidden {
    display: none;
  }

  @keyframes skeleton-pulse {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .image-grid figcaption {
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    background: #ffffff;
    margin-top: auto;
  }

  .image-grid figcaption .face-name {
    font-weight: 600;
    color: var(--text-main);
  }

  .image-grid figcaption a.btn-mini-save {
    color: var(--primary);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    background: var(--primary-light);
    border: 1px solid #a7f3d0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.12s ease;
  }

  .image-grid figcaption a.btn-mini-save:hover {
    background: var(--primary);
    color: #ffffff;
  }

  .image-grid figcaption a.btn-mini-save svg {
    width: 14px;
    height: 14px;
  }

  /* ==============================================================
     ライトボックスモーダル (スマホ撮影画面のモーダルと統一)
     ============================================================== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .lightbox-card {
    background: var(--bg-card);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes scaleUp {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .lightbox-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
  }

  .lightbox-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
  }

  .lightbox-close-btn {
    flex: none;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .lightbox-close-btn:hover {
    background: var(--secondary-hover);
    color: var(--text-main);
  }

  .lightbox-close-btn svg {
    width: 20px;
    height: 20px;
  }

  .lightbox-img-wrapper {
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    max-height: 65vh;
  }

  .lightbox-img-wrapper img {
    max-width: 100%;
    max-height: 65vh;
    object-fit: contain;
    display: block;
  }

  .lightbox-actions {
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
    background: #ffffff;
    display: flex;
    justify-content: flex-end;
  }

  .lightbox-actions .btn-download {
    flex: none;
    padding: 9px 16px;
    font-size: 14px;
  }

  /* ==============================================================
     トースト通知 (スマホ撮影画面と完全一致)
     ============================================================== */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #ffffff;
    padding: 11px 20px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    animation: toastIn 0.2s ease-out;
  }

  @keyframes toastIn {
    from { transform: translate(-50%, 10px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  #toast[hidden] {
    display: none !important;
  }

  #toast.error {
    background: #dc2626;
  }

  #toast.success {
    background: var(--primary);
  }

  /* Lucide アイコン共通調整 */
  svg.lucide {
    stroke-width: 2.2;
    vertical-align: middle;
  }
</style>
