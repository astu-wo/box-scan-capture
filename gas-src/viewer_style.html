<!-- File: viewer_style.html -->
<style>
  :root {
    color-scheme: light;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --border-focus: #10b981;
    --primary: #059669;
    --primary-hover: #047857;
    --primary-light: #ecfdf5;
    --secondary: #ffffff;
    --secondary-text: #334155;
    --secondary-border: #cbd5e1;
    --secondary-hover: #f1f5f9;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 14px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-main);
  }

  .header-icon {
    color: var(--primary);
    width: 22px;
    height: 22px;
  }

  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }

  section {
    margin-bottom: 20px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--text-main);
  }

  .section-title h2, .section-title h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .section-title svg {
    color: var(--primary);
    width: 20px;
    height: 20px;
  }

  /* 情報カード（Info / Notice） */
  .info {
    background: var(--primary-light);
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid #a7f3d0;
    border-left: 5px solid var(--primary);
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(5, 150, 105, 0.08);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info.info-callout {
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
  }

  .info p {
    margin: 0;
    font-size: 14px;
    color: #065f46;
    font-weight: 500;
    line-height: 1.4;
  }

  .info-icon {
    width: 22px;
    height: 22px;
    color: var(--primary);
    flex-shrink: 0;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
  }

  .info-row-icon {
    width: 18px;
    height: 18px;
    color: var(--primary);
  }

  .info strong {
    color: #065f46;
    font-size: 16px;
    font-weight: 700;
  }

  /* フォームフィールド & ラベル */
  .form-field {
    margin-top: 14px;
  }

  .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary-text);
    margin-bottom: 6px;
  }

  .field-label .label-icon {
    width: 15px;
    height: 15px;
    color: var(--text-muted);
  }

  /* 入力フィールド */
  .input-group {
    position: relative;
    display: flex;
    align-items: center;
    max-width: 400px;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    width: 18px;
    height: 18px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.15s ease;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px 14px 12px 38px;
    font-size: 15px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--secondary-border);
    background: #ffffff;
    color: var(--text-main);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }

  input[type="password"]:hover {
    border-color: #94a3b8;
  }

  input[type="password"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04), 0 0 0 3px rgba(5, 150, 105, 0.2);
  }

  .error-text {
    color: var(--danger);
    background: var(--danger-light);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #fecaca;
    max-width: 400px;
  }

  /* アクション・ボタン */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    margin-bottom: 12px;
  }

  button {
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
    font-family: inherit;
    border: 1px solid transparent;
  }

  button svg {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
  }

  button.primary {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 1px 2px rgba(5, 150, 105, 0.25);
  }

  button.primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  button.secondary {
    background: var(--secondary);
    color: var(--secondary-text);
    border-color: var(--secondary-border);
    box-shadow: var(--shadow-sm);
  }

  button.secondary:hover:not(:disabled) {
    background: var(--secondary-hover);
    border-color: #94a3b8;
  }

  button:active:not(:disabled) {
    transform: scale(0.985);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  /* テーブル一覧 */
  .table-container {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    text-align: left;
  }

  th {
    background: var(--primary-light);
    color: #065f46;
    font-weight: 600;
    font-size: 13px;
  }

  .th-content {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .th-icon {
    width: 15px;
    height: 15px;
    color: var(--primary);
  }

  tbody tr {
    cursor: pointer;
    transition: background 0.12s ease;
  }

  tbody tr:hover {
    background: #f0fdf4;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  #empty-message {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-muted);
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #empty-message[hidden] {
    display: none !important;
  }

  .empty-icon {
    width: 32px;
    height: 32px;
    color: var(--text-muted);
    opacity: 0.7;
  }

  #empty-message p {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
  }

  /* ページネーション */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 16px;
  }

  #page-info {
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary-text);
  }

  /* 画像グリッド */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }

  .image-grid figure {
    margin: 0;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .image-grid figure:hover {
    box-shadow: var(--shadow-md);
  }

  .image-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    cursor: zoom-in;
    display: block;
    background: #f1f5f9;
  }

  .image-grid figcaption {
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
  }

  .image-grid figcaption a {
    color: var(--primary);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    background: var(--primary-light);
    border: 1px solid #a7f3d0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.12s ease;
  }

  .image-grid figcaption a:hover {
    background: var(--primary);
    color: #ffffff;
  }

  /* ライトボックス */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 200;
    padding: 20px;
  }

  .lightbox img {
    max-width: 92vw;
    max-height: 80vh;
    object-fit: contain;
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }

  .lightbox[hidden] {
    display: none !important;
  }

  /* トースト通知 */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #ffffff;
    padding: 11px 20px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #toast[hidden] {
    display: none !important;
  }

  #toast.error {
    background: #dc2626;
  }

  #toast.success {
    background: var(--primary);
  }

  /* Lucide アイコン共通調整 */
  svg.lucide {
    stroke-width: 2.2;
    vertical-align: middle;
  }
</style>
