<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>箱スキャン - 撮影</title>
  <link rel="stylesheet" href="style.css?v=4">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <h1>
      <i data-lucide="scan-barcode" class="header-icon"></i>
      <span>箱スキャン</span>
    </h1>
  </header>

  <main>
    <!-- パスワード入力 -->
    <section id="auth-section">
      <div class="form-field">
        <label for="password-input" class="field-label">
          <i data-lucide="key-round" class="label-icon"></i>
          <span>パスワード</span>
        </label>
        <div class="input-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password-input" placeholder="パスワードを入力" autocomplete="current-password">
        </div>
      </div>
      <div id="auth-error" class="error-text" hidden></div>
      <div class="actions">
        <button id="btn-login" class="primary">
          <i data-lucide="log-in"></i>
          <span>ログイン</span>
        </button>
      </div>
    </section>

    <!-- スキャン -->
    <section id="scanner-section" hidden>
      <div class="video-container">
        <video id="video" playsinline muted></video>
        <div class="scan-overlay">
          <div class="scan-reticle"></div>
        </div>
      </div>
      <div class="scan-status">
        <i data-lucide="scan" id="scan-icon"></i>
        <span id="scan-result">読取待ち…</span>
      </div>
      <div class="actions">
        <button id="btn-rescan" class="secondary">
          <i data-lucide="refresh-cw"></i>
          <span>再スキャン</span>
        </button>
        <button id="btn-drafts" class="secondary">
          <i data-lucide="archive"></i>
          <span>下書き一覧</span>
        </button>
      </div>
    </section>

    <!-- 撮影 -->
    <section id="capture-section" hidden>
      <div class="info">
        <div class="info-row">
          <i data-lucide="barcode" class="info-row-icon"></i>
          <span>バーコード: <strong id="confirmed-barcode"></strong></span>
        </div>
        <div id="face-guide" class="face-guide">
          <i data-lucide="camera" class="guide-icon"></i>
          <span id="face-guide-text">1/4: 正面を撮影</span>
        </div>
      </div>
      <div class="video-container">
        <video id="cam" playsinline muted></video>
      </div>
      <div class="actions">
        <button id="btn-shutter" class="primary shutter-btn">
          <i data-lucide="camera"></i>
          <span>撮影</span>
        </button>
      </div>
      <div id="thumbs" class="thumbs"></div>
    </section>

    <!-- 確認 -->
    <section id="review-section" hidden>
      <div class="section-title">
        <i data-lucide="check-circle-2"></i>
        <h2>確認</h2>
      </div>
      <div class="info">
        <div class="info-row">
          <i data-lucide="barcode" class="info-row-icon"></i>
          <span>バーコード: <strong id="review-barcode"></strong></span>
        </div>
      </div>
      <div id="review-thumbs" class="thumbs labeled"></div>
      <div class="form-field">
        <label for="note-input" class="field-label">
          <i data-lucide="message-square" class="label-icon"></i>
          <span>備考（任意）</span>
        </label>
        <div class="input-group textarea-group">
          <textarea id="note-input" placeholder="メモや特記事項を入力してください" rows="2"></textarea>
        </div>
      </div>
      <div class="actions">
        <button id="btn-retake" class="secondary">
          <i data-lucide="rotate-ccw"></i>
          <span>撮り直し</span>
        </button>
        <button id="btn-upload" class="primary">
          <i data-lucide="upload-cloud"></i>
          <span>アップロード</span>
        </button>
      </div>
    </section>

    <!-- 下書き一覧 -->
    <section id="drafts-section" hidden>
      <div class="section-title">
        <i data-lucide="archive"></i>
        <h2>下書き一覧</h2>
      </div>
      <div id="drafts-list"></div>
      <div class="actions">
        <button id="btn-drafts-close" class="secondary">
          <i data-lucide="x"></i>
          <span>閉じる</span>
        </button>
      </div>
    </section>

    <div id="toast" hidden></div>
  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
